<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZCode Canvas 外观中心</title><style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#15171c;color:#eee}
body{margin:0;padding:28px;max-width:560px;margin:auto}
h1{font-size:22px;margin:0 0 20px}
section{background:#22252d;border:1px solid #383c48;border-radius:12px;padding:18px;margin:14px 0}
label{display:block;margin:10px 0 5px;color:#b9bfce}
select{box-sizing:border-box;width:100%;padding:9px;border-radius:7px;border:1px solid #505667;background:#181a20;color:#fff}
input[type="range"]{box-sizing:border-box;width:100%;padding:0;border:0;background:transparent;accent-color:#7c5cff}
button{padding:8px 14px;border:0;border-radius:7px;background:#7c5cff;color:#fff;font-weight:600;cursor:pointer}
button.secondary{background:#3a3f4e}
button.link{float:right;padding:0;background:none;color:#8ab4ff;font-weight:400;font-size:13px}
#status{margin-left:12px;color:#9fe3b1}
.hint{color:#9299aa;font-size:12px;margin:8px 0 0}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.row.two{grid-template-columns:1fr 1fr}
.actions{display:flex;align-items:center;gap:10px;margin-top:8px}
#file{color:#b9bfce;font-size:13px;word-break:break-all}
.val{float:right;color:#eee;font-variant-numeric:tabular-nums}
</style></head><body><h1>ZCode Canvas 外观</h1><section><label for="theme">主题</label><select id="theme"><option value="">无主题</option></select><p class="hint">切换后立即生效，正在使用的 ZCode 主窗口就是预览。</p></section><section><label>当前壁纸</label><div class="actions"><button id="pick">选择图片…</button><button id="clear" class="secondary">清除壁纸</button><span id="file"></span></div><p class="hint">图片会复制到 Canvas 自己的目录；清除后主题自带的壁纸（如果有）会重新生效。Wallpaper Engine 项目请先用 <code>zcode-canvas wallpaper import</code> 导入。</p></section><section><label>壁纸选项<button id="tune-reset" class="link">重置</button></label><div class="row"><div><label for="fit">铺放</label><select id="fit"><option>cover</option><option>contain</option><option>fill</option><option>tile</option><option>center</option></select></div><div><label for="blur">模糊<span class="val" id="blur-val"></span></label><input id="blur" type="range" min="0" max="200" step="1"></div><div><label for="dim">压暗<span class="val" id="dim-val"></span></label><input id="dim" type="range" min="0" max="100" step="5"></div></div><div class="row"><div><label for="scale">缩放<span class="val" id="scale-val"></span></label><input id="scale" type="range" min="50" max="300" step="5"></div><div><label for="saturate">饱和<span class="val" id="saturate-val"></span></label><input id="saturate" type="range" min="0" max="200" step="5"></div><div><label for="brightness">亮度<span class="val" id="brightness-val"></span></label><input id="brightness" type="range" min="50" max="150" step="5"></div></div><div class="row two"><div><label for="contrast">对比<span class="val" id="contrast-val"></span></label><input id="contrast" type="range" min="50" max="150" step="5"></div><div><label for="grayscale">灰度<span class="val" id="grayscale-val"></span></label><input id="grayscale" type="range" min="0" max="100" step="5"></div></div><p class="hint">拖动滑杆，松手后立即生效；缩放以铺放焦点为锚点。</p></section><section><div class="actions"><button id="reset" class="secondary">恢复默认外观</button><span id="status"></span></div><p class="hint">只取消当前主题和单独设置的壁纸，不会删除用户主题、已复制的图片或其它配置。</p></section><script src="panel.js"></script></body></html>
