<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZCode Canvas 外观中心</title><style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#15171c;color:#eee}body{margin:0;padding:28px;max-width:760px;margin:auto}h1{font-size:24px;margin:0 0 24px}section{background:#22252d;border:1px solid #383c48;border-radius:12px;padding:18px;margin:14px 0}label{display:block;margin:10px 0 5px;color:#b9bfce}select,input{box-sizing:border-box;width:100%;padding:9px;border-radius:7px;border:1px solid #505667;background:#181a20;color:#fff}button{margin-top:18px;padding:10px 16px;border:0;border-radius:7px;background:#7c5cff;color:#fff;font-weight:600;cursor:pointer}#status{margin-left:12px;color:#9fe3b1}.hint{color:#9299aa;font-size:12px}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
</style></head><body><h1>ZCode Canvas 外观中心</h1><section><label for="theme">主题</label><select id="theme"><option value="">无主题</option></select><label for="wallpaper">已导入静态壁纸</label><select id="wallpaper"><option value="">不使用壁纸</option></select><div class="hint">Wallpaper Engine 资源需要先用 CLI 导入；这里只显示 Canvas 已保存的静态图片。</div><div class="row"><div><label for="fit">铺放</label><select id="fit"><option>cover</option><option>contain</option><option>fill</option><option>tile</option><option>center</option></select></div><div><label for="blur">模糊（px）</label><input id="blur" type="number" min="0" max="200" step="1"></div><div><label for="dim">压暗（0-1）</label><input id="dim" type="number" min="0" max="1" step="0.05"></div></div><button id="save">应用外观</button><span id="status"></span></section><section><strong>安全说明</strong><p class="hint">本面板只读取 Canvas 配置和已导入文件，不执行主题脚本，也不访问网络。点击应用后，运行中的 ZCode 主窗口会实时刷新。</p></section><script src="panel.js"></script></body></html>
